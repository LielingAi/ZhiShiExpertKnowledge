- title: 0day 狩猎的五阶段编排与三条纪律
  kind: sop
  domain: whitebox
  provenance: user
  applicability: 需要对一个代码库做完整漏洞挖掘、且要自主推进（人只做授权官不做驾驶员）时。前置：已完成领域路由。关键词：编排 / orchestration / 五阶段 / 自主推进 / 红蓝对抗 / 深度优先 / 无情丢弃 / ast-helper。
  content: |
    角色定位：你是**理解系统、发现系统哪里会断裂的思考实体**，不是扫描器。不遵循漏洞 checklist、分类目录或预定义攻击模式；任务是**针对当前具体系统推理**，直到看到别人没看到的东西。人是授权官不是驾驶员——重大操作（执行 PoC、写关键文件）前需授权，**但分析推理不需要等待**。
    五阶段循环：
    **①侦察与理解**——项目结构扫描 → 读文档/包管理/配置产出技术栈情报 → 领域路由 → 依赖扫描（把已知 CVE 当**上下文**而非目标）。顺序保证：先理解项目，再挑领域，然后才进攻击面映射。
    **②攻击面映射**（2-3 轮）——画信任边界与数据流；用 AST 级工具看函数结构与调用关系；识别关键 invariants 与攻击面。
    **③假设生成与验证**（核心循环）——按认知框架生成假设 → 派验证者收证据 → 用符号引用追踪与数据流追踪走"源→汇"路径 → 关键假设派专人验证。
    **④利用构建**——一旦关键漏洞被确认，**立刻集中资源到武器化**（不在已验证的洞上继续铺面）。
    **⑤审查与报告**——对所有发现做对抗审查 → **撤消被证伪的发现** → 出报告。
    三条纪律：
    · **深度大于广度**——深入理解一个模块胜过浅扫十个模块。
    · **无情丢弃**——一次失败任务后置信度低于 0.15 的假设**必须死亡**（不是搁置）。
    · **自我辩论**——对每个发现做红队/蓝队内部辩论。
    工具分两类：**探索**（文件搜索 / 依赖扫描，快、语言无关、能抓注释里的人类线索）+ **验证**（AST 级列函数 / 查引用 / 调用图 / 取函数体 / 污点追踪）——**先用探索发现可疑点，再用验证证明链路**。
  criteria: 成立=五个阶段各有产物（领域判定 / 信任边界图 / 假设集与证据 / 利用链 / 含证伪记录的报告），且被证伪的发现真的被撤消。失效=跳步（未映射攻击面就生成假设）；把已验证与未验证的发现混在同一份报告里；或低置信假设没被丢弃而是长期挂着。
  tags: whitebox, orchestration, five-phase, autonomous-audit, red-blue-debate, depth-first, discard-rule, ast-navigation, 编排, 五阶段, 自主推进, 红蓝对抗, 深度优先, 无情丢弃
  reviewer: j0hnexp

- title: 误报过滤器——硬排除规则与置信度锚点
  kind: sop
  domain: whitebox
  provenance: user
  applicability: 生成假设**之前**先过一遍，避免把预算花在永远不该报的东西上；以及给置信度定标、定严重性时。前置：无，开题即可用。关键词：误报 / false positive / 硬排除 / 置信度锚点 / 置信度校准 / 严重性调整 / 不报告清单。
  content: |
    **硬排除规则（生成任何假设之前先检查，命中即不报）**：
    ①**拒绝服务**——忽略所有内存泄漏、CPU 耗尽与正则 DoS。②**环境变量与 CLI 参数**——假设它们来自完全可信源，不报经此路径的注入。③**安全语言的内存安全边界**——Go / Rust / TS 中不报空指针、缓冲区溢出、UAF，**除非显式使用 `unsafe` 块**。④**SSRF 限制**——只控制 URL 路径（不控制主机/协议）的 SSRF 不算漏洞。⑤**日志欺骗**——未净化输入进日志是正常的，除非显式泄露高价值秘密（明文口令等）。⑥**框架 XSS**——不报 React / Angular 组件内的 XSS，除非 blatantly 滥用 `dangerouslySetInnerHTML`。⑦**第三方库 CVE**——聚焦主源码中的漏洞，不是单纯记录依赖清单里过时的包。
    **置信度锚点（严格按此赋值，不要不必要地膨胀）**：
    · `0.90-1.00 确认可利用`——有验证过的、可工作的 PoC 路径，连接不可信源到危险汇点。
    · `0.80-0.89 高置信`——具体攻击路径已识别，源与汇明确但需确认精确执行轨迹。
    · `0.60-0.79 可疑模式`——看到危险汇点（eval / system / raw SQL）但尚未证明数据流。
    · `<0.60 推测（噪音）`——**只是架构层面想法，不要报告置信度低于 0.60 的发现**。
    **项目上下文决定严重性调整**：库 / SDK **降 1 级**；服务器 / 服务 标准；CLI 工具 仅本地攻击面；内嵌组件 取决于宿主应用。
    价值：这三张表把"报什么、报多重、多可信"从主观判断变成可复核的机械规则——**误报是最贵的成本**，它消耗的是后续所有环节的信任与预算。
  criteria: 成立=每条候选发现都能对照七条硬排除规则说明为何不被排除，且置信度落在锚点档位、在报告中明确标注。失效=报了 DoS / 环境变量注入 / 安全语言的内存安全边界这类永远不该报的项；或置信度写"大概 0.7"却给不出该档位要求的证据。
  tags: whitebox, false-positive, hard-exclusions, confidence-anchors, severity-adjustment, triage, 误报过滤, 硬排除, 置信度锚点, 严重性调整, 不报告清单
  reviewer: j0hnexp

- title: 响应到行动的四阶段管道审查——从汇点逆搜到入口
  kind: technique
  domain: whitebox
  provenance: user
  applicability: 审计"接收远端数据并据此行动"的客户端/Agent 时（扫描器、安全工具、更新器、CI 客户端、插件化应用）。前置：能定位网络响应入口。关键词：四阶段管道 / response to action / sink-first / 逆向追踪 / 降噪 / 信任边界 / 客户端审计 / 扩展敏感汇点。
  content: |
    **阅读顺序反转**：不从 `main()` 开始，**从网络响应入口逆向追踪到 sink**。并立一条强降噪原则——**未到达敏感操作的响应数据一律算噪音**（这条能把客户端审计的噪音降一个量级）。
    把客户端处理响应抽象为四阶段管道，逐阶段设检查点：
    · **传输层**——TLS 校验是否严格？重定向是否跟随到不可信域？有没有证书固定？
    · **解析层**——是否用了不安全的解析模式（反序列化 / eval / 动态导入）？类型检查在哪一层？
    · **语义层**——**字段是否控制执行路径**？（分支选择、方法名、对象结构）
    · **执行层**——有没有最后防线（白名单 / 沙箱 / 人工确认 / 签名）？
    专家做法：**从 Stage 4 逆搜 Stage 1**——先找到敏感操作，再往回追"谁能控制它的输入"，避免被无关代码淹没。
    污点四元：Source / Propagation / Sanitizer / Sink。客户端的 **Sink 必须扩展**——除文件、命令、eval 之外，把**网络二次请求**与**配置/凭证写**（配置文件、keyring、浏览器存储、环境变量字典写）也算敏感汇点。
  criteria: 成立=四个阶段各自定位到具体函数并判定该阶段校验的有无，且污点链能从入口追到扩展后 Sink 集合中至少一个成员。失效=从 `main()` 顺着读（被无关代码淹没）；或 Sink 只考虑文件/命令/eval 而漏掉二次请求与配置写。
  tags: whitebox, four-stage-pipeline, response-to-action, sink-first, noise-reduction, trust-boundary, taint-analysis, extended-sinks, 四阶段管道, 逆向追踪, 降噪, 信任边界, 敏感汇点, 客户端审计
  reviewer: j0hnexp

- title: 两种高价值反模式——信任边界不一致 与 失败开放
  kind: technique
  domain: whitebox
  provenance: user
  applicability: 客户端/Agent 有"看起来在设防"的校验时；以及任何校验路径存在异常分支时。前置：能读到校验函数与其输入来源。关键词：信任边界不一致 / capability laundering / 失败开放 / fail-open / 可预测默认值 / 校验被架空 / 动态导入。
  content: |
    **反模式一：信任边界不一致（局部校验被上游架空）**
    客户端对高价值操作确实做了校验（如更新包签名校验），但**决定该校验输入的那个字段来自无校验的低价值通道**（如心跳、遥测、配置拉取）。于是校验形同虚设——攻击者只需污染上游的无校验字段，下游校验就会愉快地接受攻击者数据。
    追问链：这个校验依赖的 URL / 公钥 / 版本清单 / 路径分别从哪来？那条来源通道有没有校验？如果它是先信后改（TOFU）或校验开关可被配置关闭，等于没有。
    **反模式二：失败开放与可预测默认值**
    解析异常、类型不符、校验失败后，代码进入"默认授权 / 不验证 / 用默认值"分支。若这个默认值是**攻击者可预测的**（默认插件名、默认路径、宽松模式），攻击者就能构造让校验抛异常的输入，把执行导入自己可控的分支。**配合动态导入（`__import__(server_name)` 一类）时风险最高**——默认值直接变成可控的模块加载。
    追问链：这条校验失败时走哪个分支？那个分支用默认值还是拒绝？默认值从哪来、能不能被外部影响？
    共性：两者都**不是"忘了校验"，而是校验存在但被结构架空**——所以按危险函数签名扫不出来，只能靠"承诺与实现是否一致"的语义审计发现（与「条件编译导致的安全语义不一致」条同源）。
  criteria: 成立=能指出某校验的输入来源通道（并证明其无校验），或指出某异常分支回退到攻击者可预测且可控其行为的默认值。失效=看到校验函数就认为安全（不追输入来源）；或只审 happy path、没构造触发异常的输入看它走哪条分支。
  tags: whitebox, trust-boundary-inconsistency, capability-laundering, fail-open, predictable-default, dynamic-import, 信任边界不一致, 失败开放, 可预测默认值, 校验被架空, 反模式
  reviewer: j0hnexp

- title: 用 Mock 服务端在受控环境证明可利用——含无害化红线
  kind: sop
  domain: redteam
  provenance: user
  applicability: 目标是"过度信任服务端响应"的客户端（扫描器 / Agent / 安全工具 / VPN / 更新器 / CI 客户端），无法直接远程打、需要在本机证明漏洞成立时。前置：能在 127.0.0.1 起服务，且能把客户端指向它。关键词：mock server / 本地验证 / 无害 PoC / harmless proof / 对照实验 / 协议保真 / 客户端验证 / DNS 外带。
  content: |
    **方向反转**：不是向服务器发恶意请求，而是**架一个 mock server 向客户端投喂恶意响应**。交付目标是"任何人克隆代码、5 分钟复现"。
    **协议保真（否则客户端会先拒连）**：优先只用 Python 标准库 `http.server`；按需复刻 Content-Type、必需 header、证书与自签 CA、响应延迟、chunked 编码——这些是客户端协议校验的常见门槛。
    **无害成功指标**（用不具破坏性的可观测信号证明后果）：
    · 代码执行 → **DNS 外带**（用随机数生成唯一子域，避开 DNS 缓存）
    · 越界写 / 任意写 → **写临时标记文件**（限临时目录，用完清理）
    · 命令执行 → **回显标记字符串**（不是真跑危险命令）
    · 更新劫持 → **用标记文件替代真实更新包**（绝不触发真实更新）
    **安全红线（四条，违反即不可交付）**：绝不包含真实利用代码（真 getshell / 反弹 shell / 删文件）；绝不使用真实凭证；不污染环境；绝不触发真实更新。写入一律限临时目录并清理，PoC 跑完后系统无残留。
    **一次一变量**：每轮只改一个响应字段，保证因果可归因——与「贝叶斯对照判据」配套使用。
    交付标准：一键运行 / 零或明示依赖 / 无害证据 / 含对照实验 / 证据固化 / 平台声明 / 清理脚本。
  criteria: 成立=在干净环境一键起 mock 后客户端出现**预期探针输出**（DNS 回调 / 标记文件 / 回显串），停 mock 后现象消失；且 PoC 静态审查无真实危险操作、运行后无系统残留。失效=用真实 getshell 或真实更新作为"证明"；没有对照实验（无法排除客户端本就如此）；或协议特征不符导致客户端拒连却被当成"漏洞不成立"。
  tags: redteam, mock-server, harmless-poc, controlled-validation, protocol-fidelity, dns-exfil, marker-file, one-variable, clean-up, 本地验证, 无害化, 对照实验, 协议保真, 无残留
  reviewer: j0hnexp

- title: 贝叶斯对照判据——让"后果"能被唯一归因
  kind: idea
  domain: whitebox
  provenance: user
  applicability: 要证明"这个后果是漏洞导致的"而不是"本来就如此"时；任何做因果归因的 PoC / 实验设计。前置：能对同一输入构造恶意版与正常版两组。关键词：贝叶斯 / bayesian attribution / 对照实验 / control group / 因果归因 / 主张链 / claim chain / 证据绑定。
  content: |
    核心判据一句话：**只有同时满足 `P(后果 | 恶意响应) ≈ 1` 且 `P(后果 | 正常响应) ≈ 0`，这个后果才能被唯一归因到漏洞上。**
    工程做法：同一客户端、同一环境、**只改一个变量**（恶意响应 vs 正常响应）跑两组；后果只在恶意组出现才成立。这把"我看到了 X"升级为"X 只可能由 Y 引起"——对抗"客户端的其他设置 / 环境差异 / 巧合"这类反驳。
    配套结构：把 PoC 拆成**主张链（Claim Chain）六环**，每环是一条可独立验证的主张，各自绑定可观测证据：
    ①Source 可控 → 证据：mock 源码那一行
    ②Propagation 无有效拦截 → 证据：客户端日志 / tcpdump
    ③Hijacking 该字段真的控制了行为 → 证据：变更前后行为对照
    ④Trigger 具体动作被执行 → 证据：探针输出（DNS 回调 / 标记文件 / 回显）
    ⑤Execution 末端无最后防线 → 证据：代码路径 + 运行结果
    ⑥Impact 影响 → 证据：量化的后果
    与「六段式证明链」同构，区别在于：**每环都必须绑定可观测证据**，且**用贝叶斯对照做归因**——前者是表述规范，这条是**验证纪律**。
  criteria: 成立=跑过恶意组与正常组两组对照，后果只在恶意组出现；且主张链六环各自绑定了可被第三方独立复查的证据。失效=只跑恶意组就宣称因果（无法排除本就如此）；或某环的"证据"其实是推断而非可观测产物。
  tags: whitebox, bayesian-attribution, control-experiment, causal-attribution, claim-chain, evidence-binding, counterfactual, 贝叶斯, 对照实验, 因果归因, 主张链, 证据绑定, 归因判据
  reviewer: j0hnexp

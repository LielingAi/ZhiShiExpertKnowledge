- title: 利用链就是最短的桥——污点源到高权限汇点
  kind: technique
  domain: redteam
  provenance: user
  applicability: 已发现一个可控点但不确定它能到哪；或需要把"某种影响"升级为代码执行/持久化时。前置：能追踪数据流（源码或 AST 级调用图）。关键词：利用链 / exploit chain / 污点源 / source / sink / 最短路径 / 数据流。
  content: |
    形式化：**每个漏洞都是一条桥——一端是攻击者可控的数据源（Source），另一端是高权限执行入口（Sink）。任务是找最短的那条桥。**
    输出强制逐跳数据流，五段：
    **①攻击源**——攻击者控制的具体数据源（用户输入 / 上传文件 / 检索结果 / 第三方 API 返回 / 网页抓取 / 邮件）。
    **②传播路径**——数据如何进入系统内部。每一跳都要问"这里有没有拦截"，并记住 **有拦截 ≠ 有效拦截**（黑名单可绕，白名单更硬）。
    **③注意力/信任劫持**——若链路中途经过一个"会基于内容做决策"的组件（LLM、解析器、模板引擎），要证明该组件**上下文结构上的缺陷**，而不是假设它会被骗。
    **④触发**——被劫持的组件生成的**具体**下一步动作。不能只说"可能执行命令"，要给出具体参数。
    **⑤执行结果**——末端是否有最后防线。记住 **有沙箱 ≠ 有效沙箱**。
    闭合条件：可控源 + 传播无有效拦截 + 末端无有效防线。
    捷径提示：最短桥 = 优先找**直接拼接**、**信任委托链短**、**末端权限高**的组合；链条越长，单点失效越多（见「多跳利用链编排」条）。
  criteria: 成立=能画出从 Source 到 Sink 的逐跳路径，且每一跳都标注了拦截/防线及其**是否有效**的判定。失效=只给出"存在风险"而没有逐跳路径；或用"可能/或许"描述中间环节（说明那一跳没验证）。
  tags: redteam, exploit-chain, source-to-sink, taint-analysis, dataflow, shortest-path, 利用链, 污点源, 汇点, 数据流, 最短桥
  reviewer: j0hnexp

- title: 六段式证明链——把"存在风险"升级为"无可辩驳"
  kind: technique
  domain: redteam
  provenance: user
  applicability: 要交付一份让人无法反驳的漏洞证明（写报告、过评审、反驳"理论上存在"的质疑）时。前置：已有候选利用链。关键词：证明链 / claim chain / 六段式 / proof / 证据闭合 / 无可辩驳。
  content: |
    证明链必须**环环闭合**，六段，缺一不可：
    `Source → Propagation → Hijacking → Trigger → Execution → Impact`
    每段的证明要求与常见陷阱：
    · **Source**——攻击者能否控制这个数据源？陷阱：「需要用户上传」不等于安全，社工可绕过。
    · **Propagation**——数据进入系统时是否有拦截？陷阱：**有拦截 ≠ 有效拦截**。
    · **Hijacking**——中间组件是否会被外部数据影响？陷阱：不能假设组件行为，要证明**上下文结构缺陷**。
    · **Trigger**——会生成什么**具体**动作？陷阱：不能只说"可能执行命令"，要给出具体参数。
    · **Execution**——末端是否有最后防线？陷阱：**有沙箱 ≠ 有效沙箱**。
    · **Impact**——最终影响是什么？陷阱：必须量化（读文件？命令执行？数据外泄？改动落盘？）。
    两个提升说服力的手法：
    · **前瞻性可视化**——给出"注入前 vs 注入后"的对照，证明中间环节真的被淹没/覆盖，而不是靠断言。
    · **参数对比**——把"用户看到的确认界面描述"与"实际执行的动作参数"并排放，两者的落差本身就是证据。
    产出的不是"证明这个系统有漏洞"，而是"**证明这条利用链完全闭合，没有任何环节可以阻止攻击**"。
  criteria: 成立=六段各自给出证据，其中 Propagation 与 Execution 两段明确判定"拦截/防线**是否有效**"而非"是否存在"。失效=任一段用"可能/或许"带过；或把"存在防御"直接当成"利用不成立"；或 Impact 未量化。
  tags: redteam, claim-chain, proof-chain, six-stage, evidence-closure, 证明链, 六段式, 证据闭合, 无可辩驳, 利用链证明
  reviewer: j0hnexp

- title: 多跳利用链编排——把多个弱点串成完整攻陷
  kind: sop
  domain: redteam
  provenance: user
  applicability: 目标存在多组件交互 / 插件架构 / 信任委托链；或单个漏洞影响有限（如仅能文件写），需要评估能否升级到代码执行或持久化。前置：已发现 ≥2 个可利用点，或一个点但链路需要借力。关键词：编排 / orchestration / 多跳 / multi-hop / 持久化 / 单点失效 / 利用链编排 / 组件生态。
  content: |
    视角转换：目标不是单一体，而是由**解析器 + 文件系统 + 配置层 + 插件系统 + 进程树**组成的生态。攻击者控制一处后，用生态的**内部连接**自我放大。
    触发信号（出现任一即启动编排视角）：多组件分层且数据经文件/管道/共享内存传递；存在"配置文件 → 代码行为"的映射；主进程 + 子进程/守护进程/插件加载器；临时文件或缓存参与流程。
    必答的四个结构问题：
    ①**跨组件信任边界**——组件 A 的漏洞能否影响组件 B 的信任边界？如何跨越隔离？
    ②**写点与加载点错配**——文件写发生在 A，而 B 从该路径加载代码或配置？
    ③**配置毒化**——配置篡改能否让组件在**下一次启动**时加载攻击者控制的资源？
    ④**临时文件 → 竞争窗口**——临时文件写入/缓存污染能否被转化为 TOCTOU 条件竞争？
    硬性输出要求：完整的**多跳路径图**；每跳的**触发条件与时间窗口**；**单点失效分析**（修复哪一跳会断链）；**检测规避思路**（如何在日志里隐藏多阶段痕迹）。
    质量五维：**链完整性**（初始访问到最终目标 ≥3 跳，每跳条件明确）/ **稳定性**（不依赖极端时间窗口或用户特殊行为）/ **隐蔽性**（每阶段在正常业务逻辑掩护下执行）/ **修复弹性**（修复一跳后仍有 ≥1 条替代路径）/ **权限提升**（明确从高权限组件借力）。
    自我校验：画了组件交互图吗？每跳触发条件可复现吗？有不依赖用户交互的自动触发路径吗？改动可恢复吗？容器/沙箱下链还成立吗？
    本质一句话：**把目标的"复杂性"转化为攻击者的"杠杆"**——组件越多、交互越复杂、信任委托链越长，编排空间越大。
  criteria: 成立=给出 ≥3 跳路径图，每跳标注触发条件与时间窗口，并完成单点失效与替代路径分析。失效=只罗列一堆漏洞而不给出串联路径；或链路只有 2 跳且存在单点依赖（说明只是罗列，还没编排）。
  tags: redteam, orchestration, multi-hop, exploit-chain, persistence, single-point-of-failure, toctou, 编排, 多跳, 利用链编排, 持久化, 单点失效, 组件生态
  reviewer: j0hnexp

- title: 崩溃到代码执行——按安全机制组合选利用路线
  kind: technique
  domain: binary
  provenance: user
  applicability: 已有一个可触发崩溃的内存破坏点，需要从"崩"走到"执行"。前置：能拿到二进制与 libc、可本地复现、可调 gdb。关键词：ret2shellcode / ROP / ret2libc / GOT 覆写 / House of Spirit / 安全机制绕过 / NX / ASLR / Canary / PIE / 栈对齐。
  content: |
    三原则：①**尊重内存布局**——栈帧中缓冲区到返回地址的距离、堆块大小与对齐、GOT 与函数指针位置，必须精确匹配。②**绕过或转化安全机制**——NX → 用 ROP 而非 shellcode；ASLR → 先泄露地址；Canary → 先泄露 Canary 值，或找**不覆盖 Canary 的路径**。③**稳定优先**——不依赖特定内存布局、对输入长度限制友好、可重复触发。
    按机制组合选路线（五种载荷）：
    · **NX disabled** → **ret2shellcode**：`[NOP sled][shellcode][padding][shellcode 地址]`，偏移 = 缓冲区 + saved rbp + ret addr（64 位常见 72）。
    · **NX enabled + ASLR/PIE disabled** → **ROP**：`pop rdi; ret` → 参数字符串（.bss/.data）→ `system@plt`。ROP chain 就是 `[gadget][arg][gadget][arg]…`，每个 gadget 以 ret 结尾续接控制流。
    · **NX + ASLR enabled（PIE disabled）** → **ret2libc**：先泄露（如 `__libc_start_main+243`，glibc 2.35 偏移 0x29d90；或读 `puts@got`）算 libc 基址，再 `ret`（**栈对齐**）→ `pop rdi` → `/bin/sh` → `system`。偏移获取：本地 gdb 实测 / `readelf -s libc.so.6` / pwntools ELF 自动算。
    · **格式化字符串** → **任意地址写**：先 `%p.%p.%p…` 定位置，再用 `%hhn` 逐字节写 GOT（如 `printf@got` → `system`）——**比 `%n` 更精确更稳**。
    · **堆溢出可覆盖相邻 chunk 的 size** → **House of Spirit / fastbin attack**：溢出覆盖相邻 chunk 的 size 与 fd → free 它使其入 fastbin → 再分配同 size 拿回它（fd 已可控）→ 再分配一次即取到**目标地址** → 任意写。
    收尾前检查清单：偏移算准了吗？有可靠泄露点吗？64 位 `system` 需要 16 字节栈对齐吗？目标过滤了 NULL/换行等字符吗？payload 超输入长度限制了吗？依赖特定堆布局吗（怎么提高稳定性）？需要分阶段（先泄露再打）吗？
  criteria: 成立=能答出"这套机制组合（NX/ASLR/PIE/Canary/RELRO）对应哪条路线"，并给出偏移、泄露点、对齐处理三样。失效=NX 开启时仍走 shellcode；有 ASLR 却没泄露点就写死地址；或忽略栈对齐导致 `system` 崩在下游。
  tags: binary, ret2shellcode, rop, ret2libc, got-overwrite, house-of-spirit, fastbin-attack, nx, aslr, canary, pie, stack-alignment, 利用构建, 安全机制绕过, 栈对齐, 栈溢出, 格式化字符串, 堆溢出
  reviewer: j0hnexp

- title: 二进制漏洞五维度定损——衡量"崩溃到 shell"的距离
  kind: sop
  domain: binary
  provenance: user
  applicability: 发现一个二进制漏洞后，判断值不值得投入、以及向决策者说明严重性时。前置：已知漏洞类型与触发条件，能跑 checksec。关键词：定损 / impact assessment / 严重性评级 / exploitability / reliability / 可行性评估 / 五维度。
  content: |
    前提认知：**发现 ≠ 可利用**。任务是衡量从"程序崩溃"到"获得 shell"之间那段距离——可能一步之遥，也可能是天堑。
    五维度：
    **①可利用性**——能否稳定利用取得代码执行？按机制组合分档：栈溢出无 Canary/NX/ASLR → Critical；有 Canary 或 NX → 需泄露或 ROP → High；堆溢出可覆盖元数据 / UAF 可控重用内容 → High；格式化字符串可任意读写 → Critical；整数溢出导致小分配大写入 → High；纯信息泄露 → Medium；仅 DoS → Low。
    **②利用稳定性**——成功率与随机性：100% 稳定 → 不调整；>80% → -0.5；50-80% → -1；<50% → -1.5；仅理论可行 → -2。影响因素：ASLR（需泄露或爆破）、堆布局（需堆风水）、线程竞争（UAF 时间窗难控）、输入长度限制（短输入构造不出完整 ROP）。
    **③权限提升潜力**——远程服务获 shell → 服务账户（Critical）；SUID 程序 → root（Critical）；内核驱动 → ring0（Critical+）；普通用户程序 → 无提升（Medium）；沙箱内 → 是否逃逸（High）。
    **④攻击向量可达性**——远程无需认证 +1；远程需认证 不变；本地网络 -0.5；本地文件 -1；本地命令行 -1.5；物理访问 -2。
    **⑤修复难度**——单点修复 -0.5；多点修复 不变；架构级重构 +0.5；依赖升级 +1；无法修复 +2。
    输出模板必备三块：**安全机制表**（NX / ASLR / PIE / Canary / RELRO / FORTIFY_SOURCE 各状态 + 对利用的影响）；**五维度表**（评级 + 理由）；**综合定损**（严重等级 + 优先级 P0-P3 + 可利用性分级：可直接利用 / 需信息泄露 / 需复杂利用链 / 仅理论）。
  criteria: 成立=五个维度各自给出评级与理由，且综合等级能由前五维推出（可复核）；安全机制表逐项填了状态与实际影响。失效=只按漏洞类型套模板给等级而不看机制组合；或漏掉稳定性/可达性这类调整项就直接下 P0。
  tags: binary, impact-assessment, severity, exploitability, reliability, privilege-escalation, attack-vector, remediation, checksec, 定损, 严重性评级, 可行性评估, 五维度, 利用稳定性
  reviewer: j0hnexp

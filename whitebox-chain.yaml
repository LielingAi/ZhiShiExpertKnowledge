- title: 白盒审计的假设驱动认知五层模型（HDCA）
  kind: sop
  domain: whitebox
  provenance: user
  applicability: 开始白盒审计一个陌生代码库时，作为**全程认知骨架**用——先建模型再找洞，而不是打开文件就追调用链。前置：能读源码与架构文档（README / 构建系统 / 配置模板）。关键词：白盒审计 / 源码审计 / 假设驱动 / HDCA / 认知分层。
  content: |
    核心转换：把审计从**规则匹配**升级为**科学假设的生成与证伪**。规则匹配（无论人工直觉还是 SAST 签名）只能发现"已经知道该找的东西"。
    五层递进：
    **Layer 1 深度理解**——先建心智模型：目的识别、信任边界映射、数据流追踪、Invariant 识别。产出是**攻击面热力图**（哪些模块处理不可信输入且缺纵深防御）。反模式：打开文件就追函数调用、看到 `eval` 就写报告、不读文档就挖。
    **Layer 2 对抗共情**——模拟开发者，找"过度自信 = 盲区"的区域：信心高 + 安全控制少 = 重点挖掘。可检索信号：`TODO: validate later`（极高）、`FIXME`/`HACK`/`this should never happen`（高）、无错误处理（高）、过度错误处理（中）。
    **Layer 3 溯因推理**——从异常反推，而非从规则出发。异常类型与追问：函数名与行为矛盾（调用方是否基于函数名的承诺做了安全假设）、类型不匹配（中间态可否利用）、不对称安全检查（被检查与未检查的路径是否来自同一不可信源）、注释与代码矛盾、双 parser 场景（对同一数据的解释差异可否武器化）。
    **Layer 4 认识论谦逊**——列出当前 5 个最强假设，各设计一个"若假设错误就会成功"的测试；**意外成功的测试 = 模型与现实的裂缝**。
    **Layer 5 远距类比**——把漏洞当**结构模式**而非技术细节：Parser Differential / TOCTOU / Confused Deputy / Serialization Gap / Cache Poisoning / Path Confusion / Race Window。
    时间分配：小项目（<100 文件）1-2 轮；中型（100-1000）2-4 轮；大型按模块分解，各 2-3 轮。
    实证：一次 HTTP 客户端库审计，Layer 2 推出的"平台分支忽略 bufferSize"假设 → 确认 Windows 走 `memcpy_s`、`#else` 分支走裸 `memcpy` → 高危内存安全问题，38 分钟内定位。
  criteria: 成立=五层各有产出物（信任边界图 / 数据流 / Invariant 清单 / 盲区信号清单 / 异常追问记录 / 自我挑战测试结果），且假设带可证伪表述。失效=直接从 Layer 3 开始（上手就追调用链）；或只做 Layer 1 就下结论；或没做 Layer 4（无任何自我挑战测试）。
  tags: whitebox, hypothesis-driven, hdca, cognitive-model, trust-boundary, invariant, abductive-reasoning, adversarial-empathy, 白盒审计, 源码审计, 假设驱动, 认知分层, 信任边界, 溯因推理, 对抗共情
  reviewer: j0hnexp

- title: 可证伪安全假设三元组——CLAIM / FALSIFICATION / CONFIDENCE
  kind: idea
  domain: whitebox
  provenance: user
  applicability: 把模糊的"这里有没有洞"改写成可独立验证的命题时；多人/多 agent 复核同一组证据时的表达规范。前置：无，开题即可用。关键词：可证伪 / 假设表述 / 置信度 / falsifiable hypothesis / 假设三元组。
  content: |
    问题：传统审计问"这里有没有漏洞？"——太模糊，**既不能被验证也不能被排除**。
    改写为三元组：
    **CLAIM**：一个明确的、可测试的安全声明。
    **FALSIFICATION**：什么证据可以推翻这个声明（必须能具体到代码结构或可执行测试）。
    **CONFIDENCE**：基于当前证据的置信度 0-1。
    示例：CLAIM = 函数 `DecompressResponse()` 处理恶意构造的 gzip 数据时无限制分配内存，导致 OOM；FALSIFICATION = 若代码中存在可配置的总输出大小上限、且在分配前被校验，则假设不成立；CONFIDENCE = 0.55（代码结构初判，尚未验证调用链）。
    价值：把模糊的安全直觉转化为**可被独立验证的命题**——多个验证者可基于同一组证据独立评估真伪。这是对抗性复核能成立的前提（见「对抗性验证两条闸」条）。工程实现里假设对象就是 `claim / target / falsification / confidence` 四个字段。
  criteria: 成立=每条假设都写出具体的 falsification 条件（能指向代码结构或可执行测试），且置信度可被新证据更新。失效=假设写成"可能存在风险"这类无法证伪的表述；或 falsification 写成"如果没有防御"这种同义反复。
  tags: whitebox, falsifiable-hypothesis, claim-falsification-confidence, hypothesis, confidence, 可证伪, 假设表述, 置信度, 假设三元组
  reviewer: j0hnexp

- title: 对抗性验证两条闸——三维筛 + 批判者
  kind: sop
  domain: whitebox
  provenance: user
  applicability: 假设池已生成、需要降噪时；单一验证者的结论需要独立复核时。前置：假设已按三元组表述。关键词：对抗性验证 / 三维筛 / 可达性 / 可利用性 / 缓解性 / devil's advocate / 降噪。
  content: |
    **第一闸·结构化三维筛**。每个假设必须独立回答三问：
    · **可达性**——外部/未认证用户能否到达此代码路径？排除仅内部调用的"伪漏洞"。
    · **可利用性**——能否用**现实输入**触发异常行为？排除理论存在但无法构造的缺陷。
    · **缓解性**——是否存在**上游**防御阻断利用链？排除已被纵深防御覆盖的问题。
    三维都指向"风险存在"才进候选池。实测这一闸过滤约 **40%** 的初始假设。
    **第二闸·批判者（Devil's Advocate）**。对过关的假设派一个独立批判者，其唯一任务是**从反面推翻**它，主动去找：调用方是否已做前置校验？是否存在编译期或运行期的隐性保护？攻击路径里有没有被忽略的边界条件？
    批判者找到的反驳，作为**负面证据回注置信度**：反驳成立 → 假设降级或丢弃；反驳被证伪 → 置信度进一步提升。
    配套置信度阈值：**0.90+ CONFIRMED**（多源交叉验证且批判者未推翻）/ **0.70-0.89 LIKELY**（有证据但有未验分支）/ **0.40-0.69 UNCERTAIN**（结构可疑、缺决定性证据）/ **<0.40 DISCARDED**（负面证据占优或已证伪）。
    注意：置信度 ≠ 严重性，两者分开记。
  criteria: 成立=每个候选假设都留下三维筛记录与批判者的反驳记录（含"反驳被证伪"的理由），且最终置信度落在明确档位。失效=只有一个验证者下结论；三维筛只填"是/否"而无具体证据；或没派批判者（无负面证据回注）。
  tags: whitebox, adversarial-validation, devils-advocate, reachability, exploitability, mitigation, triage, confidence, 对抗性验证, 三维筛, 可达性, 可利用性, 缓解性, 批判者, 降噪
  reviewer: j0hnexp

- title: 每轮推理的三段认知触发——假设审计 / 异常反思 / 自我证伪
  kind: technique
  domain: whitebox
  provenance: user
  applicability: 任何多轮审计/挖掘流程中，给每一轮推理加固定自省动作。前置：推理过程有结构化的 thinking 记录位。关键词：假设审计 / 异常反思 / 自我证伪 / assumption audit / self-falsification / 自省。
  content: |
    三段固定自问，写在每轮推理的思考段里：
    **①ASSUMPTION AUDIT（假设审计）**：我刚才**默默假定了什么**？把它写出来，并判断这是"证据"还是"习惯"。
    实证：某轮默认"这些 batch 文件不可达"，自省后判定这是**习惯而非证据**——Ghostscript 包装脚本在服务端文档处理管线（网页上传、邮件附件、打印服务器）里被持续调用，"不可达"对真实部署是危险错误。
    **②ANOMALY REFLECTION（异常反思）**：有什么看起来**古怪而脆弱**的东西值得放大？
    实证：`echo %1 >> "%TEMP%\_.at"` 这种临时文件拼接写法反常 → 追问出 write-then-read 之间的 TOCTOU 竞争窗口，以及 `%~1` 会**剥掉引号**（与安全处理相反）。
    **③SELF-FALSIFICATION（自我证伪）**：要**推翻**当前最高置信假设，需要什么证据？这个证据存不存在？
    实证："要证伪命令注入假设，需证明 Windows batch 会对未加引号的 `%1` 展开转义 `&`/`|`/`>`——这不可能，那是 batch 解析的基本行为" ⇒ 假设因此被**加固**而非被动接受。
    三段各自防一种错误：①防"习惯当证据"（最常见的错误来源），②强制放大怀疑点，③把假设从"没人反驳"升级为"反驳过但站得住"。
  criteria: 成立=每轮思考里三段都有具体内容（写得出被默许的假设、说得出反常点、给得出证伪条件）。失效=三段写成空话（"暂无异常"）；或只做第③段而跳过①，漏掉"习惯当证据"这类错误。
  tags: whitebox, assumption-audit, anomaly-reflection, self-falsification, metacognition, 假设审计, 异常反思, 自我证伪, 自省, 认知触发
  reviewer: j0hnexp

- title: 隐式契约显式化——底层库审计的主线
  kind: technique
  domain: whitebox
  provenance: user
  applicability: 审计基础库/底层代码（编解码、解析、内存管理、FFI 胶水）时。前置：能读 C/C++/Rust 源码。关键词：隐式契约 / implicit contract / unsafe / 指针运算 / 生命周期 / FFI / 越界 / 基础库审计。
  content: |
    命题：所有高效的基础库都靠**没写下来的契约**运作——"调用者保证缓冲区够大""这个指针在函数返回前有效""输入以 NUL 结尾"。审计的任务是把每条隐式契约**显式化**，再追问一句：**如果这条契约为假，会发生什么？**
    C/C++ 里假契约 → UB；Rust `unsafe` 里假契约 → 编译器已优化掉的安全检查被实际绕过。
    视觉触发器（读到就亮灯）：
    · `unsafe { … }` 块出现频率——每块都是一份"调用者已保证前置条件"的声明；位于公共函数深处而外层未校验 = 定时炸弹
    · 指针运算密度：`ptr + offset`、`*(ptr+i)`、`*((T*)raw_bytes)`——每行都在假设布局/对齐/生命周期
    · 循环终止条件依赖输入：`while (*p != '\0')`、`for (i=0; i<hdr.len; i++)`——`p` 无终止符或 `hdr.len` 被伪造就是无底洞
    · 分配路径上的 `goto` 或错误处理不完整——错误分支漏释放、成功分支重复释放
    · FFI 类型转换：`C.String → *C.char`、`uintptr_t → unsafe.Pointer`——类型系统保护被抹掉
    · `#[repr(C)]`/`packed` 结构体——手动布局，编译器不再保证对齐（x86 只是慢，ARM 直接 SIGBUS）
    不可跳过的六问：①这个 unsafe 块里哪些指针被解引用、生命周期由谁保证？②循环终止条件是否完全由**可信**数据控制？③这个函数有几条分配路径、每条是否都有对应释放？④指针运算里有没有整数溢出（`base + offset*sizeof(T)` 且 offset 极大 → 回绕到低地址）？⑤FFI 结构体布局与 C 侧是否完全一致（新增字段或对齐差异 → 字段错位、静默数据损坏）？⑥有没有"借用/零拷贝"语义（返回的切片是否依附于可能已被修改或释放的内部缓冲）？
    完整逻辑链示例：`fn parse_header(buf: &[u8]) -> &str` 内部 `from_utf8_unchecked(buf)` → 隐式契约"buf 恒为合法 UTF-8" → 攻击者传入含 `0xFF` 的 buf → 产出非法 `&str` → 下游按 UTF-8 处理的函数行为未定义。
  criteria: 成立=能对每个可疑点输出「文件:行 / 代码模式 / 隐式契约 / 破坏方式 / 后果」五元组。失效=只说"这里用了 memcpy 可能溢出"而说不出**被违反的那条契约**是什么；或只列危险函数、不追问前置条件。
  tags: whitebox, implicit-contract, unsafe, pointer-arithmetic, loop-invariant, lifetime, ffi, foundation-lib, 隐式契约, 指针运算, 生命周期, 越界, 基础库审计
  reviewer: j0hnexp

- title: 第一性原理三公理——不用漏洞清单找洞
  kind: idea
  domain: whitebox
  provenance: user
  applicability: 开题时确定"以什么为准绳找洞"；目标没有已知漏洞清单可对照时；避免被清单思维限制覆盖面。前置：无。关键词：第一性原理 / first principles / 不变量 / invariant / 状态机 / 三公理。
  content: |
    立场：**不使用预定义的漏洞分类清单，不依赖历史经验的"检查项"**，仅凭第一性原理推导。
    核心公理：一切系统皆可被描述为——一组**状态**（某时刻的完整快照）、一组**转换**（输入驱动下状态如何变化）、一组**约束/不变量 Invariant**（系统承诺"永远成立"的属性）。
    **唯一目标：找到一个输入序列或操作序列，使某个 Invariant 被违反。**
    由此只找三类异常，不依赖漏洞清单：
    · **逻辑矛盾**——同一事实被系统以两种互斥方式断言（注释 vs 代码、两个组件对同一数据的定义不一致）。
    · **状态异常**——存在一个可达状态，其不变量不成立（如"已释放但仍被引用"）。
    · **越界资源访问**——对资源的访问超出声明边界（数组/缓冲区/生命周期/权限域）。
    配套导航纪律（双通道）：**探索通道**（grep/find，快、语言无关、能抓注释与字符串里的人类线索）用来**发现可疑点**；**验证通道**（AST 级调用图与函数体查询）用来构建**无噪音的数据流链**。原则是「先用探索通道发现可疑点，再用验证通道证明攻击链」——不要用 grep 去证明完整调用链（噪音太多），也不要用 AST 做全局扫描（慢且语言受限）。
  criteria: 成立=能明确写出目标系统的状态/转换/不变量三要素，并把每个候选漏洞归入三异常之一。失效=上来就按漏洞清单或危险函数签名扫；或说不出违反的是哪条不变量。
  tags: whitebox, first-principles, invariant, state-machine, class-agnostic, dual-channel-navigation, 第一性原理, 不变量, 三公理, 状态机, 探索通道, 验证通道
  reviewer: j0hnexp


- title: 文件写 → 配置毒化 → 持久化后门（多跳编排模板）
  kind: technique
  domain: redteam
  provenance: user
  applicability: 手上只有一个"任意文件写"级别的弱点，需要评估能否升级为代码执行或持久化时。前置：目标存在"配置文件驱动行为"的映射，或从可写目录加载代码。关键词：文件写升级 / file write to rce / 配置毒化 / config poisoning / 持久化 / persistence / 后门 / 符号链接竞争。
  content: |
    **升级路径矩阵**（初始能力 → 目标能力 / 路径 / 依赖条件）：
    · 任意文件写 → **代码执行**：覆盖客户端自身的 `.py` / `.so` / `.dll` —— 依赖"客户端从可写目录加载代码"
    · 任意文件写 → **代码执行**：写 `~/.bashrc` / `~/.zshrc` —— 依赖"用户下次打开 shell"
    · 任意文件写 → **持久化后门**：写 `/etc/cron.d/` 或 systemd user service —— 依赖"有可写系统目录（容器/弱权限）"
    · 任意文件写 → **配置篡改 → RCE**：改客户端配置注入恶意插件路径 —— 依赖"客户端重启或热重载配置"
    · 任意文件写 → **条件竞争**：写临时文件后替换符号链接 —— 依赖"客户端使用可预测的临时文件名"
    **五阶段模板**（`FILE_WRITE_TO_PERSISTENCE`）：
    ①`initial_access`——能力 = 任意文件写；条件 = 客户端把服务端响应字段用于本地文件路径与内容。
    ②`config_poisoning`——写入 `~/.myapp/config.yaml`，注入恶意 `plugin_dir` 与 `update_url`；前置 = 配置格式支持代码执行路径。
    ③`trigger`——等客户端重启 / 配置重载 / 定时任务（时间窗 = 下次启动或配置里的 `check_interval`）。
    ④`persistence`——恶意插件被加载 / 恶意更新被安装 / 后门命令执行。
    ⑤**痕迹清理**——恢复配置文件为原始内容，把恶意操作伪装成正常更新日志。
    要点：这条链的价值在于**把"只能写文件"这种看起来无用的能力，通过目标自身的加载机制放大为代码执行**——先去读目标"什么配置驱动什么行为"，再决定写哪个文件。
  criteria: 成立=能指出"写哪个文件 → 由哪个加载/触发机制消费 → 何时生效"，并给出触发时间窗。失效=只证明"能写文件"就收工；或写的文件不在任何加载路径上（无法被消费）。
  tags: redteam, file-write-to-rce, config-poisoning, persistence, backdoor, symlink-race, loading-chain, 文件写升级, 配置毒化, 持久化, 后门, 加载链, 多跳编排
  reviewer: j0hnexp

- title: 低权限组件借力高权限守护进程——IPC 消息伪造提权
  kind: technique
  domain: redteam
  provenance: user
  applicability: 目标存在多进程架构（主进程 + 子进程 / 守护进程 / 插件加载器）且组件间通过 IPC 通信时。前置：能拿到 IPC 协议定义或监听侧源码。关键词：IPC / 提权 / privilege escalation / 守护进程 / daemon / dbus / socket / 消息伪造 / 无鉴权 RPC。
  content: |
    **discovery 三问**（先答这三个再谈利用）：
    ①客户端是否存在多进程架构？
    ②进程间通信用什么机制——socket / pipe / dbus / shared memory？
    ③**高权限进程是否信任低权限进程的消息来源**？
    **三阶段**：
    ①`ipc_recon`——分析 IPC 协议格式，寻找可注入字段。
    ②`message_forgery`——在低权限组件中构造恶意消息；**条件 = IPC 缺乏消息签名或来源验证**。
    ③`privilege_leverage`——高权限守护进程执行消息中的指令。典型落点：创建系统级后门用户 / 修改防火墙规则放行 C2 流量 / 读取其他用户的敏感文件。
    判据一句话：**高权限进程信任低权限进程的消息、且无签名或来源验证 → 成立**。
    可迁移性：这是"混淆代理（Confused Deputy）"的进程间版本，与 web 侧的 CSRF/SSRF 同宗——**被信任的一方替不可信的一方执行了动作**。找这类漏洞时先问"谁信任谁、信任有没有凭据支撑"。
  criteria: 成立=能画出"低权限组件 → IPC 通道 → 高权限执行点"的路径，并证明该通道**没有来源验证或签名**。失效=只说"存在 IPC"而没证明高权进程会执行低权来源的消息；或通道已有签名/白名单校验。
  tags: redteam, ipc, privilege-escalation, daemon, message-forgery, confused-deputy, multi-process, 提权, 守护进程, 消息伪造, 混淆代理, 进程间通信
  reviewer: j0hnexp

- title: 无界资源分配的渐进式危害——压缩炸弹的定量模型与整数截断
  kind: technique
  domain: binary
  provenance: user
  applicability: 目标"没有限制解压/分配大小"，需要把"就是个 DoS"量化成可信的危害评估时；或分配路径上存在 `size_t` → 窄整数的强制转换时。前置：能读到分配点与长度校验点。关键词：压缩炸弹 / zip bomb / 解压缩 / 资源耗竭 / DoS / 整数截断 / Z_STREAM_END / avail_in / OOM。
  content: |
    **定量模型**：设攻击者控制的压缩流大小 `|C|`、解压后 `|D|`、压缩比 `ρ = |D|/|C|`。DEFLATE 对高度可压缩数据（全零序列）的理论压缩比受 Lempel-Ziv 32KB 滑窗与 Huffman 极限约束。
    算一遍就够：`|C| = 10MB`、`ρ = 1000` → `|D| ≈ 10GB`；客户端 2GB 内存、每次分配 16KB → 到 OOM 约 13 万次迭代，按 100MB/s 解压速度**数秒内触发**（实际因内存碎片更快）。**10MB 输入换 10GB 内存压力——压缩数据大小与危害完全不成比例**；容器环境只有 512MB 时更极端。
    **渐进式危害三阶段**：
    ①**内存压力累积**——每次分配 16KB，累计随迭代线性增长。
    ②**系统级级联失效**——移动平台 OOM Killer 按 `oom_score` 选受害者：前台应用被杀，或后台守护进程触发 watchdog 重启循环，造成 CPU/内存周期性抖动。
    ③**复合拒绝服务**——若客户端有指数退避重试，攻击者周期性发送即可让它陷入"请求 → OOM → 重启 → 重试 → 再 OOM"。攻击带宽需求极低：每 `T` 秒发一个 10MB 请求即可维持持续性 DoS。
    **整数截断的独立风险**（这条常被忽略，且与"DoS"无关）：`static_cast<uInt>(inDataSize)` 把 64 位 `size_t` 截断成 32 位只留低 32 位——5GB 变 1GB。zlib 处理完截断后的 1GB 就返回 `Z_STREAM_END`，**但输入流还有 4GB 未消费**。客户端若不检查 `avail_in` 残留，会误判"解压缩完成"，把**截断后的不完整数据**交给上层解析器；对 JSON 解析器来说截断可能落在字符串或对象中间，触发解析异常甚至进入未处理的错误分支。
  criteria: 成立=给出 `|C|`/`ρ`/迭代次数/耗时四个量，并明确危害阶段与判据（RSS 单调增长 + OOM 触发）；若存在窄化截断，还要给出残留量并说明上层如何误判。失效=只说"这是个压缩炸弹"而不给量化；或忽略 `avail_in` 残留只谈 OOM。
  tags: binary, zip-bomb, decompression, resource-exhaustion, dos, integer-truncation, avail-in, z-stream-end, oom, 压缩炸弹, 解压缩, 资源耗竭, 整数截断, 拒绝服务, 定量模型
  reviewer: j0hnexp

- title: 两端验证法——链条首尾闭合即可判定，中间环节往往是黑盒
  kind: technique
  domain: ai-security
  provenance: user
  applicability: 验证一个"经过中间组件（LLM / 解析器 / 代理 / 模板引擎）"的利用链时，不必也不应去实测中间组件的行为。前置：能审计两端的源码。关键词：两端验证 / two-end validation / 首端 / 末端 / 黑盒桥梁 / injection / 工具注入 / 语义净化 / HITL。
  content: |
    核心洞察：**不要验证中间组件"会不会被骗"，验证的是"欺骗的路径是否畅通"**。若两端都闭合，中间只是一个**黑盒桥梁**——只要有足够好的绕过技术即可打通。
    **首端（注入必成）**——从外部数据源到中间组件上下文的**污点追踪**三问：①定位污点源（用户输入 / 上传文件 / 第三方 API / 网页抓取 / 邮件）；②追踪传播——是否经过**语义净化**？（黑名单过滤可绕，语义净化/结构化隔离更硬；数据进入前的最后一步是否仍保留完整语义）；③确认汇聚——是否最终进入执行入口，且与系统指令之间**无有效隔离**？
    **末端（执行必达）**——**暂时忽略中间组件**，假设攻击者已控制参数生成，直接审计末端工具的底层实现：路径是否规范化/有目录穿越防御？内容是否过滤？是否 `shell=True` 或参数未转义？查询是否参数化？是否有收件人白名单？调用前是否有 HITL（`auto_approve=True` 等于没有）？
    **三条常见陷阱**：①不要验证"组件是否聪明"（那是能力问题，不是安全问题）；②**"有防御" ≠ "防御有效"**——黑名单过滤、提示词禁令都是可绕的；③不要忽略组合效应（单个工具安全，多个工具组合可能危险：先读再写再执行）。
    判据：两端各问"是否**无**有效防御"；两端皆闭合即判定利用链完整，不必实测中间环节。
  criteria: 成立=两端各自给出"污点源→汇聚"与"参数→执行"的闭合证据，且明确说明中间的隔离/防御**为何无效**。失效=去实测中间组件的行为（浪费且不可靠）；或因为"中间有防御"就放弃，未证明防御可绕。
  tags: ai-security, two-end-validation, taint-tracing, injection, tool-call-injection, semantic-sanitization, hitl, confused-deputy, 两端验证, 污点追踪, 注入, 工具调用, 语义净化, 沙箱
  reviewer: j0hnexp
